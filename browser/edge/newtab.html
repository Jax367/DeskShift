<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>新标签页</title><link rel="stylesheet" href="newtab.css"></head>
<body><div id="wallpaper" aria-hidden="true"></div><main>
<form id="search" role="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"></circle><path d="m16 16 4.5 4.5"></path></svg><input id="query" aria-label="搜索或输入网址" placeholder="搜索或输入网址" autocomplete="off"><button type="submit" aria-label="搜索">↗</button></form>
<nav id="sites" aria-label="常用网站"></nav><p id="empty" hidden>浏览网站自动推荐，或点击「添加网址」。</p>
</main><dialog id="site-editor" aria-labelledby="editor-title"><form id="site-form" novalidate><h2 id="editor-title">添加常用网址</h2><label for="site-title">名称</label><input id="site-title" maxlength="80" placeholder="例如 GitHub" autocomplete="off"><label for="site-url">网址</label><input id="site-url" maxlength="2048" placeholder="例如 github.com" autocomplete="off" spellcheck="false"><label class="auto-setting"><input type="checkbox" id="auto-sites">根据访问记录自动补充网址</label><p class="editor-hint">手动添加的优先显示，最多固定 8 个。</p><p id="site-error" role="alert"></p><div class="editor-tools"><button id="remove-site" type="button" hidden>删除网址</button><button id="restore-sites" type="button" hidden>恢复隐藏推荐</button></div><div class="editor-actions"><button id="cancel-site" type="button">取消</button><button id="save-site" type="submit">保存</button></div></form></dialog><span id="status" class="status" role="status"></span><script src="newtab.js"></script></body></html>
